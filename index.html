<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool of Experts</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260911-2">
</head>
<body>
<div class="frame">
  <div class="titlebar">
    <span class="logo">◍ POOL OF EXPERTS</span>
    <span class="tag"></span>
    <button class="mute" id="mute" type="button" aria-pressed="false" title="Sound on/off">🔊</button>
    <span class="dots"><i></i><i></i><i></i></span>
  </div>
  <div class="hud" id="hud" style="display:none">
    <button class="gauge money-gauge" id="g-money" type="button" aria-expanded="false" aria-controls="budget-panel">
      <span class="k">💶 Budget <span class="caret">▾</span></span>
      <span class="v" id="hud-money">€3,000,000</span>
      <span class="sub" id="hud-spent">nothing spent yet</span>
    </button>
    <div class="gauge time-gauge" id="g-time" hidden>
      <div class="k">📅 Schedule</div>
      <div class="v" id="hud-weeks">on time</div>
      <div class="sub" id="hud-deadline">deadline: 01 Mar 2027</div>
    </div>
    <div class="gauge rep" id="g-rep" hidden>
      <div class="k">Reputation</div>
      <div class="v" id="hud-repword">Solid</div>
      <div class="bar"><div class="fill" id="hud-repfill" style="width:100%"></div></div>
    </div>
  </div>
  <div class="budget-panel" id="budget-panel" hidden>
    <div class="bstack" id="budget-stack"></div>
    <ul class="legend" id="budget-legend"></ul>
  </div>
  <div class="feed" id="feed" style="display:none">
    <span class="src">Quiet news day</span> — the call has just opened.
  </div>
  <div class="phasebar" id="phasebar"></div>
  <div class="stage" id="stage"></div>
</div>
<script src="data.js?v=20260911-2"></script>
<script src="rules.js?v=20260911-2"></script>
<script src="art.js?v=20260911-2"></script>
<script src="sound.js?v=20260911-2"></script>
<script src="game.js?v=20260911-2"></script>
<script>start();</script>
</body>
</html>
